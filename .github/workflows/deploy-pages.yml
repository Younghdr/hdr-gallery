name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check media file sizes
        shell: bash
        run: |
          blocked=0
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            if [ "$size" -ge 104857600 ]; then
              echo "::error file=$file::單檔已達 GitHub 100 MB 限制，請先最佳化。"
              blocked=1
            elif [ "$size" -gt 10485760 ]; then
              echo "::warning file=$file::單檔超過 10 MB，建議建立較小的 Web 版本。"
            fi
          done < <(find public -type f -print0)
          exit "$blocked"

      - name: Build static site
        run: npm run build:github
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_MUSIC_SRC: ${{ vars.NEXT_PUBLIC_MUSIC_SRC }}
          NEXT_PUBLIC_TRACKING_ENDPOINT: ${{ vars.NEXT_PUBLIC_TRACKING_ENDPOINT }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .next-github

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
